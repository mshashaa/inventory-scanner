<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Inventory Scanner</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local inventory counter</p>
          <h1>Inventory Scanner</h1>
        </div>
        <button id="exportExcel" class="icon-button" type="button" aria-label="Export to Excel" title="Export to Excel">
          XLS
        </button>
      </header>

      <section class="scanner-panel" aria-label="Barcode scanner">
        <div id="reader" class="reader">
          <div class="reader-placeholder">
            <span class="scan-line"></span>
            <p>Camera scanner</p>
          </div>
        </div>
        <div class="scanner-actions">
          <button id="startScan" class="primary" type="button">Start camera</button>
          <button id="stopScan" class="secondary" type="button" disabled>Stop</button>
        </div>
        <p id="scannerStatus" class="status" role="status">Use the camera or enter a barcode manually.</p>
      </section>

      <section class="manual-panel" aria-label="Manual barcode entry">
        <form id="manualForm" class="manual-form">
          <label for="barcodeInput">Barcode</label>
          <div class="inline-controls">
            <input id="barcodeInput" name="barcode" inputmode="numeric" autocomplete="off" placeholder="Scan or type barcode">
            <button class="primary" type="submit">Add</button>
          </div>
        </form>
      </section>

      <section class="inventory-tools" aria-label="Inventory actions">
        <div class="summary">
          <strong id="uniqueCount">0</strong>
          <span>unique items</span>
        </div>
        <div class="summary">
          <strong id="totalCount">0</strong>
          <span>total scans</span>
        </div>
        <button id="resetCounts" class="danger" type="button">Reset counts</button>
      </section>

      <section class="inventory-list" aria-label="Scanned inventory">
        <div class="list-header">
          <h2>Items</h2>
          <input id="searchInput" type="search" placeholder="Search barcode or name" aria-label="Search barcode or name">
        </div>
        <div id="emptyState" class="empty-state">
          <p>No items yet.</p>
          <span>Scan a barcode to start counting.</span>
        </div>
        <div id="itemsList" class="items-list"></div>
      </section>
    </main>

    <template id="itemTemplate">
      <article class="item-row">
        <div class="item-main">
          <input class="item-name" aria-label="Product name" placeholder="Product name">
          <code class="barcode"></code>
          <small class="updated"></small>
        </div>
        <div class="counter">
          <button class="step minus" type="button" aria-label="Decrease quantity">-</button>
          <output class="quantity"></output>
          <button class="step plus" type="button" aria-label="Increase quantity">+</button>
        </div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
